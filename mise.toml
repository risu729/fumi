#:schema https://mise.jdx.dev/schema/mise.json

min_version = "2026.11.3"

[tools]
bun = "1.4.4"
node = "26.13.1"
hk = "2.12.0"
"npm:oxlint" = "1.93.0"
oxfmt = "0.75.0"
jactionlint = "2.5.0"
shellcheck = "0.11.0"
ghalint = "1.6.0"
pinact = "5.0.2"
zizmor = "1.32.0"
tombi = "1.11.2"
rumdl = "v0.3.3"
yamlfmt = "0.21.0"
uv = "0.13.7"
yamllint = "1.38.0"
typos = "1.52.1"
pkl = "0.33.0"
betterleaks = "1.10.0"

[settings]
lockfile = true
lockfile_mode = "generate"
lockfile_platforms = ["linux-x64", "windows-x64"]

[settings.npm]
package_manager = "bun"

[env]
_.path = ["{{config_root}}/node_modules/.bin"]

[tasks.install]
description = "Install the exact locked dependencies."
run = "bun install --frozen-lockfile"

[tasks.typecheck]
description = "Check TypeScript without emitting files."
depends = ["types"]
run = "tsc --noEmit"

[tasks.types]
description = "Generate binding and runtime types from native Cloudflare configuration."
depends = ["build:attachment-parser"]
run = "cf workers types"

[tasks."build:attachment-parser"]
description = "Bundle the pinned PDF parser for an isolated, network-disabled Dynamic Worker."
sources = ["bun.lock", "mise.toml", "src/attachment-conversion-pdf-worker.ts"]
outputs = [".cloudflare/attachment-parser.js"]
run = "bun build src/attachment-conversion-pdf-worker.ts --target browser --external cloudflare:workers --drop console --minify --outfile .cloudflare/attachment-parser.js"

[tasks."build:attachment-fixtures"]
description = "Generate bounded synthetic encrypted PDF fixtures with ephemeral test keys."
sources = ["bun.lock", "test/fixtures/generate-encrypted-pdf.mjs"]
outputs = [".cloudflare/attachment-fixture.json"]
run = "node test/fixtures/generate-encrypted-pdf.mjs"

[tasks.build]
description = "Build the Worker using the pinned Cloudflare toolchain."
depends = ["build:attachment-parser"]
run = "cf build --mode production"

[tasks.test]
description = "Run synthetic Email/R2/D1 tests inside the local Workers runtime."
depends = ["build:attachment-parser", "build:attachment-fixtures"]
run = "vitest run"

[tasks."check:output"]
description = "Validate production Build Output without contacting deployed resources."
depends = ["build"]
run = "cf workers versions create --prebuilt --mode production --worker fumi --dry-run"

[tasks."test:artifact"]
description = "Run native synthetic Email/Cron events against the built bundle and local R2/D1."
depends = ["build", "build:attachment-fixtures"]
run = "node test/artifact.mjs"

[tasks."deploy:bootstrap"]
description = "Explicitly deploy the full built Worker for bootstrap or configuration changes."
run = "cf deploy --prebuilt --mode production --no-provision"

[tasks.check]
description = "Run all linters, security checks, and type checking."
run = "hk check --all --no-progress --no-fail-fast"

[tasks.ci]
description = "Run the same checks as GitHub Actions."
depends = ["check", "test", "test:artifact", "check:output"]

[tasks.fix]
description = "Apply formatter and linter fixes."
run = "hk fix --all --no-progress --no-fail-fast"

[tasks."hooks:install"]
description = "Install the local pre-commit hook."
run = "hk install --mise"
