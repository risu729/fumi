name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
defaults:
  run:
    shell: bash
# A newer PR push cancels the older run. Main runs never cancel a running one,
# because it may be applying migrations or deploying (ADR 0002). They run one at
# a time in push order; GitHub keeps only the latest queued run, which is the
# newest main commit, so the newest commit is always deployed last.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    name: CI Check
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tools
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.12
          install_args: --locked
      - name: Check repository
        run: mise run ci
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Validate the checked Worker with the shared deploy action
        uses: risu729/wrangler-deploy-action@52b0bb0f6c0969897cb84b47f4d5ebc3650f2d0c # v4.0.1
        with:
          mode: dry-run
          worker: fumi
          build-mode: production
          production-strategy: versions
  security:
    name: Security
    # The CodeQL gate before a production deployment.
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    permissions:
      contents: read
      security-events: write # Allow the called CodeQL workflow to publish results.
    uses: $/.github/workflows/codeql.yml
  deploy:
    name: Deploy Worker
    # Every main push or manual run whose checks pass deploys that commit, after
    # applying pending catalog migrations (ADR 0002).
    needs: [checks, security]
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    environment: production
    env:
      FUMI_CATALOG_DATABASE_ID: ${{ vars.FUMI_CATALOG_DATABASE_ID }}
      FUMI_PDF_PARSER_ENABLED: ${{ vars.FUMI_PDF_PARSER_ENABLED }}
      FUMI_DOCUMENT_CONVERSION_ENABLED: ${{ vars.FUMI_DOCUMENT_CONVERSION_ENABLED }}
      FUMI_ATTACHMENT_OCR_INSTANCE: ${{ vars.FUMI_ATTACHMENT_OCR_INSTANCE }}
      FUMI_MANAGED_SEARCH_INSTANCE: ${{ vars.FUMI_MANAGED_SEARCH_INSTANCE }}
      FUMI_ROUTING_RPC_WORKER: ${{ vars.FUMI_ROUTING_RPC_WORKER }}
      FUMI_ROUTING_RPC_ENTRYPOINT: ${{ vars.FUMI_ROUTING_RPC_ENTRYPOINT }}
    steps:
      - name: Checkout the checked commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require the provisioned catalog database
        run: |
          if [[ ! "${FUMI_CATALOG_DATABASE_ID}" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
            echo '::error::Set the production FUMI_CATALOG_DATABASE_ID variable after provisioning the catalog database.'
            exit 1
          fi
          echo "::add-mask::${FUMI_CATALOG_DATABASE_ID}"
      - name: Install locked tools
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.12
          install_args: --locked
          cache: "false"
      # Install the locked dependencies before any step that holds the token.
      - name: Install locked dependencies
        run: mise deps
      # The deploy action uploads the Build Output; it does not build. Build
      # with the production variables and validate the output before
      # migrating, so that a build or config failure changes nothing.
      - name: Build and validate the production Worker
        run: mise run check:output
      - name: Diagnose deployment API access without changing resources
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mise exec -- node --input-type=module <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          if (!token || !/^[0-9a-f]{32}$/i.test(account ?? "")) {
            console.log("Deployment API probes: credentials unavailable.");
          } else {
            const probes = [
              ["worker-service", "/workers/services/fumi"],
              ["worker-secret-metadata", "/workers/scripts/fumi/secrets"],
              ["workflow-metadata", "/workflows/fumi-mail-processing"],
            ];
            for (const [label, path] of probes) {
              let status = "transport-error";
              let codes = [];
              try {
                const response = await fetch(
                  `https://api.cloudflare.com/client/v4/accounts/${account}${path}`,
                  {
                    headers: { Authorization: `Bearer ${token}` },
                    signal: AbortSignal.timeout(10_000),
                    redirect: "error",
                  },
                );
                status = String(response.status);
                if (response.ok) {
                  await response.body?.cancel();
                } else {
                  const result = await response.json().catch(() => null);
                  codes = (Array.isArray(result?.errors) ? result.errors : [])
                    .map((error) => error?.code)
                    .filter(Number.isSafeInteger);
                }
              } catch {
                // Never print response bodies, URLs, headers, or credential-bearing errors.
              }
              console.log(`${label}: HTTP ${status}; error codes: ${codes.join(",") || "none"}`);
            }
          }
          NODE
      - name: Release only the current main head
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "${current_sha}" == "${GITHUB_SHA}" ]]; then
            echo "release=true" >> "${GITHUB_OUTPUT}"
          else
            # The newer main head's CI run is queued behind this one and deploys it.
            echo "release=false" >> "${GITHUB_OUTPUT}"
            echo "Main moved to ${current_sha}; ${GITHUB_SHA} is not deployed." >> "${GITHUB_STEP_SUMMARY}"
          fi
      - name: Apply pending catalog migrations
        if: ${{ steps.current.outputs.release == 'true' }}
        timeout-minutes: 10
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CF_QUIET: "1"
        run: |
          # Even `migrations list` writes: it creates the d1_migrations table when absent.
          cf=(mise exec -- cf)
          # Verify the target before changing it: the exact ID and its expected name.
          "${cf[@]}" d1 get "${FUMI_CATALOG_DATABASE_ID}" |
            jq -e --arg id "${FUMI_CATALOG_DATABASE_ID}" '(.result // .) | .uuid == $id and .name == "fumi-catalog"' > /dev/null
          pending="$("${cf[@]}" d1 migrations list "${FUMI_CATALOG_DATABASE_ID}")"
          fence="\`\`\`"
          printf '### Catalog migrations\n\nPending before this run:\n\n%sjson\n%s\n%s\n\n' "${fence}" "${pending}" "${fence}" >> "${GITHUB_STEP_SUMMARY}"
          if jq -e 'length > 0' <<< "${pending}" > /dev/null; then
            # A Time Travel restore point taken just before the first change.
            bookmark="$("${cf[@]}" d1 time-travel get-bookmark "${FUMI_CATALOG_DATABASE_ID}")"
            printf 'Time Travel bookmark before applying:\n\n%sjson\n%s\n%s\n\n' "${fence}" "${bookmark}" "${fence}" >> "${GITHUB_STEP_SUMMARY}"
            "${cf[@]}" d1 migrations apply "${FUMI_CATALOG_DATABASE_ID}"
          fi
          "${cf[@]}" d1 migrations list "${FUMI_CATALOG_DATABASE_ID}" | jq -e 'length == 0' > /dev/null
      # After the version is live, synchronize the configured Cron, Workflows, queue
      # consumer and Custom Domain (ADR 0002, amended 2026-11-23). A failure there leaves
      # the new version live and fails the job.
      - name: Deploy the checked Worker
        if: ${{ steps.current.outputs.release == 'true' }}
        uses: risu729/wrangler-deploy-action@52b0bb0f6c0969897cb84b47f4d5ebc3650f2d0c # v4.0.1
        with:
          mode: production
          worker: fumi
          build-mode: production
          production-strategy: versions
          deploy-triggers: "true"
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Record the deployed commit
        if: ${{ steps.current.outputs.release == 'true' }}
        run: |-
          {
            printf '### Worker deployment\n\n'
            printf 'Commit: %s\n\n' "${GITHUB_SHA}"
            printf 'Run: %s/%s/actions/runs/%s\n\n' "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}"
            printf 'The shared action verified the uploaded Worker version at 100%% traffic and synchronized its triggers. Email routes and message delivery require separate verification.\n'
          } >> "${GITHUB_STEP_SUMMARY}"
  actions-timeline:
    name: Generate Actions Timeline
    needs: [deploy]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: read # Read this run's jobs for the timeline.
    steps:
      - uses: Kesin11/actions-timeline@d547cc51bd6e8016ac50219eeb29a9eb385a2546 # v4.0.0
