name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
defaults:
  run:
    shell: bash
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: CI Check
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tools
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.8
          install_args: --locked
      - name: Check repository
        run: mise run ci
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Validate the checked Worker with the shared deploy action
        uses: risu729/wrangler-deploy-action@6bb27960f8e904e4961616a5b02e529df3a5a702 # v3.0.2
        with:
          mode: dry-run
          worker: fumi
          build-mode: production
          production-strategy: versions
  actions-timeline:
    name: Generate Actions Timeline
    needs: [checks]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: read # Read this run's jobs for the timeline.
    steps:
      - uses: Kesin11/actions-timeline@460b1f8a750077029ad3589824d371b200e91dcf # v3.2.1
