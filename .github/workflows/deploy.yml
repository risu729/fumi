name: Deploy
on:
  workflow_dispatch:
concurrency:
  group: production-deploy-caller
  cancel-in-progress: false
permissions: {}
defaults:
  run:
    shell: bash
jobs:
  security:
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      security-events: write # Allow the called CodeQL workflow to publish results.
    uses: $/.github/workflows/codeql.yml
  deploy:
    name: Deploy Worker
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: [security]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    environment: production
    env:
      FUMI_CATALOG_DATABASE_ID: ${{ vars.FUMI_CATALOG_DATABASE_ID }}
      FUMI_PDF_PARSER_ENABLED: ${{ vars.FUMI_PDF_PARSER_ENABLED }}
      FUMI_DOCUMENT_CONVERSION_ENABLED: ${{ vars.FUMI_DOCUMENT_CONVERSION_ENABLED }}
      FUMI_ATTACHMENT_OCR_INSTANCE: ${{ vars.FUMI_ATTACHMENT_OCR_INSTANCE }}
      FUMI_MANAGED_SEARCH_INSTANCE: ${{ vars.FUMI_MANAGED_SEARCH_INSTANCE }}
      FUMI_ROUTING_RPC_WORKER: ${{ vars.FUMI_ROUTING_RPC_WORKER }}
      FUMI_ROUTING_RPC_ENTRYPOINT: ${{ vars.FUMI_ROUTING_RPC_ENTRYPOINT }}
    steps:
      - name: Checkout the dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require the provisioned catalog database
        run: |
          if [[ ! "${FUMI_CATALOG_DATABASE_ID}" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
            echo '::error::Set the production FUMI_CATALOG_DATABASE_ID variable after provisioning and migrating the catalog database.'
            exit 1
          fi
          echo "::add-mask::${FUMI_CATALOG_DATABASE_ID}"
      - name: Install locked tools
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.11.8
          install_args: --locked
          cache: "false"
      - name: Install dependencies
        run: mise run install
      - name: Check repository
        run: mise run ci
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Validate the checked Worker with the shared deploy action
        uses: risu729/wrangler-deploy-action@6bb27960f8e904e4961616a5b02e529df3a5a702 # v3.0.2
        with:
          mode: dry-run
          worker: fumi
          build-mode: production
          production-strategy: versions
      - name: Diagnose deployment API access without changing resources
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mise exec -- node --input-type=module <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          if (!token || !/^[0-9a-f]{32}$/i.test(account ?? "")) {
            console.log("Deployment API probes: credentials unavailable.");
          } else {
            const probes = [
              ["worker-service", "/workers/services/fumi"],
              ["worker-secret-metadata", "/workers/scripts/fumi/secrets"],
              ["workflow-metadata", "/workflows/fumi-mail-processing"],
            ];
            for (const [label, path] of probes) {
              let status = "transport-error";
              let codes = [];
              try {
                const response = await fetch(
                  `https://api.cloudflare.com/client/v4/accounts/${account}${path}`,
                  {
                    headers: { Authorization: `Bearer ${token}` },
                    signal: AbortSignal.timeout(10_000),
                    redirect: "error",
                  },
                );
                status = String(response.status);
                if (response.ok) {
                  await response.body?.cancel();
                } else {
                  const result = await response.json().catch(() => null);
                  codes = (Array.isArray(result?.errors) ? result.errors : [])
                    .map((error) => error?.code)
                    .filter(Number.isSafeInteger);
                }
              } catch {
                // Never print response bodies, URLs, headers, or credential-bearing errors.
              }
              console.log(`${label}: HTTP ${status}; error codes: ${codes.join(",") || "none"}`);
            }
          }
          NODE
      - name: Refuse an outdated dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "${current_sha}" != "${GITHUB_SHA}" ]]; then
            echo '::error::Main changed after this deployment was dispatched. Dispatch a new run from current main.'
            exit 1
          fi
      - name: Deploy the checked Worker
        uses: risu729/wrangler-deploy-action@6bb27960f8e904e4961616a5b02e529df3a5a702 # v3.0.2
        with:
          mode: production
          worker: fumi
          build-mode: production
          production-strategy: versions
          deploy-triggers: "false"
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Record the deployed commit
        run: |-
          {
            printf '### Worker deployment\n\n'
            printf 'Commit: %s\n\n' "${GITHUB_SHA}"
            printf 'Run: %s/%s/actions/runs/%s\n\n' "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}"
            printf 'The shared action verified the uploaded Worker version at 100%% traffic. Email routes and message delivery require separate verification.\n'
          } >> "${GITHUB_STEP_SUMMARY}"
