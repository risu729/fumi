name: Events acceptance
# Temporary: verifies signed MCP Events against a short-lived receiver Worker.
# Remove this workflow and tools/events-receiver after acceptance.
on:
  workflow_dispatch:
    inputs:
      receiver_hostname:
        description: New fumi-events-check.<zone> hostname for the temporary receiver; must be in WEBHOOK_ORIGINS
        required: true
        type: string
concurrency:
  group: events-acceptance
  cancel-in-progress: false
permissions: {}
defaults:
  run:
    shell: bash
jobs:
  acceptance:
    name: Verify signed MCP Events
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    environment: production
    steps:
      - name: Validate and mask the receiver hostname
        # Read the input from the event file so no step log header prints it.
        run: |
          hostname="$(jq --raw-output '.inputs.receiver_hostname' "${GITHUB_EVENT_PATH}")"
          # A fixed label keeps the receiver off fumi's API host and the zone apex.
          # Check before masking so no unvalidated text reaches a workflow command.
          if [[ ! "${hostname}" =~ ^fumi-events-check\.([a-z0-9]([a-z0-9-]*[a-z0-9])?\.)+[a-z]{2,}$ ]]; then
            echo '::error::receiver_hostname must be fumi-events-check.<zone>.'
            exit 1
          fi
          echo "::add-mask::${hostname}"
          echo "RECEIVER_HOSTNAME=${hostname}" >> "${GITHUB_ENV}"
      - name: Checkout the dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install locked tools
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.11.8
          install_args: --locked
          cache: "false"
      - name: Install dependencies
        run: mise run install
      - name: Generate per-run signing secrets and read token
        run: |
          mise exec -- node --input-type=module <<'NODE'
          import { randomBytes } from "node:crypto";
          import { appendFileSync, writeFileSync } from "node:fs";
          const first = `whsec_${randomBytes(32).toString("base64")}`;
          const second = `whsec_${randomBytes(32).toString("base64")}`;
          const token = randomBytes(32).toString("hex");
          for (const value of [first, second, token]) console.log(`::add-mask::${value}`);
          writeFileSync(
            `${process.env.RUNNER_TEMP}/receiver-secrets.json`,
            JSON.stringify({ SIGNING_SECRETS: JSON.stringify([first, second]), READ_TOKEN: token }),
            { mode: 0o600 },
          );
          appendFileSync(
            process.env.GITHUB_ENV,
            `SIGNING_SECRET_1=${first}\nSIGNING_SECRET_2=${second}\nREAD_TOKEN=${token}\n`,
          );
          NODE
      - name: Refuse a hostname that is already a Worker custom domain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          count="$(curl --silent --show-error --fail --max-time 20 \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --get --data-urlencode "hostname=${RECEIVER_HOSTNAME}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains" |
            jq '[.result[]? | select(.service != "fumi-events-check")] | length')"
          if [[ "${count}" != "0" ]]; then
            echo '::error::The hostname already serves another Worker.'
            exit 1
          fi
          address="$({ dig +short A "${RECEIVER_HOSTNAME}"; dig +short AAAA "${RECEIVER_HOSTNAME}"; } | head -n 1)"
          if [[ -n "${address}" ]]; then
            echo '::error::The hostname already resolves; choose an unused hostname.'
            exit 1
          fi
      - name: Deploy the temporary receiver
        id: deploy
        working-directory: tools/events-receiver
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          export FUMI_EVENTS_RECEIVER_HOSTNAME="${RECEIVER_HOSTNAME}"
          mise exec -- cf build --mode production
          mise exec -- cf deploy --prebuilt --mode production --no-provision \
            --secrets-file "${RUNNER_TEMP}/receiver-secrets.json"
          rm -f "${RUNNER_TEMP}/receiver-secrets.json"
      - name: Wait for the receiver hostname
        run: |
          for _ in $(seq 1 36); do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 10 "https://${RECEIVER_HOSTNAME}/health" || true)"
            if [[ "${status}" == "204" ]]; then
              exit 0
            fi
            sleep 10
          done
          echo '::error::The receiver did not become reachable.'
          exit 1
      - name: Run the acceptance checks
        env:
          FUMI_ORIGIN: https://fumi.takuk.me
          ACCESS_CLIENT_ID: ${{ secrets.FUMI_EVENTS_ACCESS_CLIENT_ID }}
          ACCESS_CLIENT_SECRET: ${{ secrets.FUMI_EVENTS_ACCESS_CLIENT_SECRET }}
        run: RECEIVER_ORIGIN="https://${RECEIVER_HOSTNAME}" mise exec -- node tools/events-receiver/acceptance.mjs
      - name: Delete the temporary receiver
        if: ${{ always() && steps.deploy.outcome != 'skipped' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |-
          mise exec -- cf workers delete fumi-events-check --force
          remaining="$(curl --silent --show-error --fail --max-time 20 \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --get --data-urlencode "service=fumi-events-check" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains" |
            jq '.result | length')"
          echo "Remaining receiver custom domains: ${remaining}"
          if [[ "${remaining}" != "0" ]]; then
            echo '::error::Remove the receiver custom domain manually.'
            exit 1
          fi
